{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<div class="login-wrap">
    <div class="login-card">
        <div class="brand login-brand"><span class="brand-icon">S</span><span>sentinel<span class="brand-sub">THREAT
                    INTELLIGENCE</span></span></div>
        <p class="eyebrow">SECURE ACCESS</p>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to your security operations workspace.</p>
        <form method="post"><input type="hidden" name="csrf_token"
                value="{{ csrf_token() }}"><label>Username</label><input name="username" required
                autocomplete="username" placeholder="Your username"><label>Password</label><input name="password"
                type="password" required autocomplete="current-password" placeholder="Your password"><button
                class="button primary full">Sign in <span>→</span></button></form>
        <div class="login-foot">Authorized personnel only · Activity is audited</div>
    </div>
</div>{% endblock %}
